<body class="bg-slate-100 font-sans text-slate-800 antialiased">

    <!-- LOGIN MODAL -->
    <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 border border-slate-100">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-50 text-indigo-600 mb-4 text-2xl shadow-inner">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">Login Dashboard</h2>
                <p class="text-sm text-slate-500 mt-1">Silakan masukkan ID User dan Password Anda</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">ID User</label>
                    <input type="text" id="userId" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm" placeholder="Contoh: 0002612743">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm" placeholder="••••••••">
                </div>
                <div id="loginError" class="text-red-500 text-xs hidden text-center font-medium bg-red-50 p-2 rounded"></div>
                <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition duration-200">
                    Masuk ke Dashboard
                </button>
            </form>
            <div class="mt-6 text-center text-xs text-slate-400">
                Sistem Manajemen Penagihan & Insentif Collector
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="appContainer" class="min-h-screen flex flex-col hidden">
        
        <!-- HEADER -->
        <header class="bg-indigo-900 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>

                </div>
                <div class="flex items-center gap-4">
                    <div id="uploaderSection" class="hidden">

                            <i class="fa-solid fa-file-excel"></i> Update Excel
                            <input type="file" id="excelUpload" accept=".xlsx, .xls" class="hidden" onchange="handleExcelUpload(event)">

                    <div class="text-right">

                    </div>
                    <button onclick="logout()" class="bg-rose-600 hover:bg-rose-700 text-xs font-medium px-3 py-2 rounded-lg transition">
                        <i class="fa-solid fa-right-from-bracket"></i> Keluar
                    </button>

            </div>
        </header>

            <div class="max-w-7xl mx-auto px-4 flex overflow-x-auto space-x-2 no-scrollbar py-2" id="mainTabs">
                <button onclick="switchMainTab('INSENTIF')" class="main-tab-btn px-4 py-2.5 rounded-lg text-xs font-bold transition whitespace-nowrap bg-indigo-600 text-white shadow-sm" data-tab="INSENTIF">INSENTIF</button>
                <button onclick="switchMainTab('NOOD')" class="main-tab-btn px-4 py-2.5 rounded-lg text-xs font-bold transition whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200" data-tab="NOOD">NOOD</button>
                <button onclick="switchMainTab('1_30')" class="main-tab-btn px-4 py-2.5 rounded-lg text-xs font-bold transition whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200" data-tab="1_30">1_30</button>
                <button onclick="switchMainTab('31_60')" class="main-tab-btn px-4 py-2.5 rounded-lg text-xs font-bold transition whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200" data-tab="31_60">31_60</button>
                <button onclick="switchMainTab('BAYAR NOOD')" class="main-tab-btn px-4 py-2.5 rounded-lg text-xs font-bold transition whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200" data-tab="BAYAR NOOD">BAYAR NOOD</button>

                <button onclick="switchMainTab('BAYAR 31_60')" class="main-tab-btn px-4 py-2.5 rounded-lg text-xs font-bold transition whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200" data-tab="BAYAR 31_60">BAYAR 31_60</button>
            </div>
        </nav>

        <!-- CONTENT AREA -->
        <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
            
            <!-- COLLECTOR SUB-TABS (Dinamis) -->
            <div class="mb-6 flex items-center gap-2 overflow-x-auto pb-2" id="collectorSubTabs">
                <!-- Generated by JS -->
            </div>

            <!-- TAB CONTENT CONTAINER -->
            <div id="tabContentArea">
                <!-- Content will be injected here -->
            </div>

        </main>

        <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
            &copy; 2026 Dashboard Kinerja Penagihan & Insentif Collector. All rights reserved.
        </footer>
    </div>

        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('userId').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errDiv = document.getElementById('loginError');

            if (users[id] && users[id].pass === pass) {
                currentUser = { id, ...users[id] };
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('loggedInUserLabel').innerText = `${currentUser.name} (${currentUser.role.toUpperCase()})`;
                
                // Show Excel uploader only for Yusuf Dharma & Nikolaus Yudistira
                if (currentUser.name === "Yusuf Dharma" || currentUser.name === "Nikolaus Yudistira") {
                    document.getElementById('uploaderSection').classList.remove('hidden');
                } else {
                    document.getElementById('uploaderSection').classList.add('hidden');
                }

                initDashboard();
            } else {
                errDiv.innerText = "ID User atau Password salah!";
                errDiv.classList.remove('hidden');
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('appContainer').classList.add('hidden');
            document.getElementById('userId').value = '';
            document.getElementById('password').value = '';
            document.getElementById('loginError').classList.add('hidden');
        }

        function getAvailableCollectors(tab) {
            if (tab === '31_60' || tab === 'BAYAR 31_60') {
                return ["BUDI SATRIYO"];
            }
            if (tab === 'INSENTIF') {
                return ["BUDI SATRIYO", "I GEDE ADI PRATAMA PUTRA", "OKTAVIANUS MANIK", "RIDWAN ANDIKA", "RISKY IMAM HANAFI"];
            }
            return ["I GEDE ADI PRATAMA PUTRA", "OKTAVIANUS MANIK", "RIDWAN ANDIKA", "RISKY IMAM HANAFI"];
        }

        function switchMainTab(tab) {
            activeMainTab = tab;
            document.querySelectorAll('.main-tab-btn').forEach(btn => {
                if (btn.getAttribute('data-tab') === tab) {
                    btn.className = "main-tab-btn px-4 py-2.5 rounded-lg text-xs font-bold transition whitespace-nowrap bg-indigo-600 text-white shadow-sm";
                } else {
                    btn.className = "main-tab-btn px-4 py-2.5 rounded-lg text-xs font-bold transition whitespace-nowrap bg-slate-100 text-slate-600 hover:bg-slate-200";
                }
            });

            const collectors = getAvailableCollectors(tab);
            if (currentUser.role === 'collector') {
                activeCollector = currentUser.name;
            } else {
                if (!collectors.includes(activeCollector)) {
                    activeCollector = collectors[0];
                }
            }
            renderSubTabs(collectors);
            renderContent();
        }

        function renderSubTabs(collectors) {
            const container = document.getElementById('collectorSubTabs');
            container.innerHTML = '';
            
            let filteredColl = collectors;
            if (currentUser.role === 'collector') {
                filteredColl = collectors.filter(c => c === currentUser.name);
            }

            filteredColl.forEach(coll => {
                const btn = document.createElement('button');
                btn.className = `px-3.5 py-1.5 rounded-full text-xs font-semibold transition whitespace-nowrap border ${activeCollector === coll ? 'bg-slate-900 text-white border-slate-900 shadow' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`;
                btn.innerHTML = `<i class="fa-solid fa-user-tie mr-1.5"></i> ${coll}`;
                btn.onclick = () => {
                    activeCollector = coll;
                    renderSubTabs(collectors);
                    renderContent();
                };
                container.appendChild(btn);
            });
        }

        function renderContent() {
            const container = document.getElementById('tabContentArea');
            container.innerHTML = '';

            if (activeMainTab === 'INSENTIF') {
                renderInsentifTab(container);
            } else {
                renderTransactionTab(container, activeMainTab);
            }
        }

                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-3"><i class="fa-solid fa-star mr-1.5 text-amber-500"></i> Raport & Kinerja</h3>
                            <div class="bg-white p-3 rounded-lg border border-slate-200 flex justify-between items-center">
                                <div>
                                    <span class="text-[10px] text-slate-500 block">Raport / Keterangan</span>
                                    <span class="font-bold text-xs text-slate-800">${item['RAPORT']} (${item['KETERANGAN']})</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-[10px] text-slate-500 block">Nilai</span>
                                    <span class="font-bold text-sm text-indigo-600">${item['NILAI']}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Diagram Batang KPI Collector -->
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-4"><i class="fa-solid fa-chart-bar mr-1.5 text-indigo-600"></i> Diagram KPI Collector (Flow, Balance, Flow Ever)</h3>
                        <div class="relative h-64 w-full">
                            <canvas id="kpiChart_${item['NAMA COLL'].replace(/\s+/g, '_')}"></canvas>
                        </div>
                    </div>
                </div>`;
            });
            html += `</div>`;
            container.innerHTML = html;

            // Render Chart for each item
            dataList.forEach(item => {
                const ctx = document.getElementById(`kpiChart_${item['NAMA COLL'].replace(/\s+/g, '_')}`).getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['KPI Flow', 'KPI Balance', 'KPI Flow Ever'],
                        datasets: [{
                            label: 'Persentase KPI',
                            data: [item['KPI FLOW'] * 100, item['KPI BALANCE'] * 100, item['KPI FLOW EVER'] * 100],
                            backgroundColor: ['rgba(99, 102, 241, 0.8)', 'rgba(59, 130, 246, 0.8)', 'rgba(16, 185, 129, 0.8)'],
                            borderColor: ['rgb(99, 102, 241)', 'rgb(59, 130, 246)', 'rgb(16, 185, 129)'],
                            borderWidth: 1,
                            borderRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { beginAtZero: true, max: 100 }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
            });
        }

        function renderTransactionTab(container, sheetKey) {
            let rawData = dbData[sheetKey] || [];
            let filteredData = rawData;
            
            if (currentUser.role === 'collector') {
                filteredData = rawData.filter(d => d['Collector'] === currentUser.name);
            } else if (activeCollector && (sheetKey !== '31_60' && sheetKey !== 'BAYAR 31_60')) {
                filteredData = rawData.filter(d => d['Collector'] === activeCollector);
            }

            const totalSipok = filteredData.reduce((acc, curr) => acc + Number(curr['Sipok']), 0);
            const totalAkun = filteredData.length;

            let html = `
            <div class="space-y-6">
                <!-- Summary Cards -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                        <div>
                            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Sipok</span>
                            <h3 class="text-xl font-bold text-slate-900 mt-1">Rp ${totalSipok.toLocaleString('id-ID')}</h3>
                        </div>
                        <div class="w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg">
                            <i class="fa-solid fa-wallet"></i>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                        <div>
                            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Akun / Konsumen</span>
                            <h3 class="text-xl font-bold text-slate-900 mt-1">${totalAkun} Akun</h3>
                        </div>
                        <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg">
                            <i class="fa-solid fa-users"></i>
                        </div>
                    </div>
                </div>
            `;

            // Pie Chart for comparison if admin/supervisor and multiple collectors
            if (currentUser.role !== 'collector' && sheetKey !== '31_60' && sheetKey !== 'BAYAR 31_60') {
                html += `
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                    <div>
                        <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider mb-2"><i class="fa-solid fa-chart-pie mr-1.5 text-indigo-600"></i> Grafik Perbandingan Total Sipok per Collector</h3>
                        <p class="text-xs text-slate-500">Perbandingan kontribusi total saldo pokok (sipok) masing-masing kolektor pada kategori ini.</p>
                    </div>
                    <div class="relative h-64 w-full">
                        <canvas id="comparisonPieChart"></canvas>
                    </div>
                </div>`;
            }

            // Table Data
            html += `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                        <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider">Daftar Konsumen (${sheetKey})</h3>
                        <span class="text-xs text-slate-500 font-medium">Menampilkan ${filteredData.length} data</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-slate-50 text-slate-600 border-b border-slate-200 font-semibold">
                                    <th class="p-3.5">Collector</th>
                                    <th class="p-3.5">Nama Konsumen</th>
                                    <th class="p-3.5">Tipe Barang</th>
                                    <th class="p-3.5 text-center">Angsuran Ke</th>
                                    <th class="p-3.5">Jatuh Tempo</th>
                                    <th class="p-3.5 text-right">Sipok</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">`;
            
            if (filteredData.length === 0) {
                html += `<tr><td colspan="6" class="p-6 text-center text-slate-400">Tidak ada data untuk kolektor ini.</td></tr>`;
            } else {
                filteredData.forEach(row => {
                    html += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-3.5 font-medium text-slate-700">${row['Collector'] || '-'}</td>
                        <td class="p-3.5 font-semibold text-slate-900">${row['Nama Konsumen'] || '-'}</td>
                        <td class="p-3.5"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${row['Tipe Barang'] === 'MOBIL' ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}">${row['Tipe Barang'] || '-'}</span></td>
                        <td class="p-3.5 text-center">${row['Angsuran Ke'] || '-'}</td>
                        <td class="p-3.5 text-slate-600">${row['Jatuh Tempo'] || '-'}</td>
                        <td class="p-3.5 text-right font-mono font-semibold text-slate-900">Rp ${Number(row['Sipok'] || 0).toLocaleString('id-ID')}</td>
                    </tr>`;
                });
            }

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>`;

            container.innerHTML = html;

            // Render Pie Chart if applicable
            if (currentUser.role !== 'collector' && sheetKey !== '31_60' && sheetKey !== 'BAYAR 31_60') {
                const collMap = {};
                rawData.forEach(d => {
                    const c = d['Collector'] || 'Lainnya';
                    collMap[c] = (collMap[c] || 0) + Number(d['Sipok'] || 0);
                });

                const labels = Object.keys(collMap);
                const values = Object.values(collMap);

                const ctxPie = document.getElementById('comparisonPieChart').getContext('2d');
                new Chart(ctxPie, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: values,
                            backgroundColor: ['#6366f1', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'],
                            borderWidth: 2,
                            borderColor: '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
                        }
                    }
                });
            }
        }

    </script>
